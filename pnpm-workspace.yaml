# pnpm 12 reads its settings from this file, not from .npmrc: engine-strict in
# .npmrc is ignored (verified 2026-11-26), which let Node 26 install with a warning.
engineStrict: true

packages:
  - packages/*
  - apps/*
  - tools/golden

# server and web run on Alpine (musl) and e2e on the Playwright image (glibc)
# over one node_modules, so the native bindings of Vite and Rolldown must exist
# for both (research R-02, review M6).
supportedArchitectures:
  os: [linux]
  cpu: [arm64, x64]
  libc: [musl, glibc]

# One version per dependency across workspaces (research "Pinned versions",
# registry read of 2026-11-26, aged cutoff 2026-11-12). @types/node is the
# newest 22.x published on or before the cutoff; it is used by server, tools
# and test files only, never by packages/core (A-03).
catalog:
  typescript: 6.0.3
  eslint: 10.14.0
  typescript-eslint: 8.72.2
  eslint-plugin-boundaries: 7.4.3
  eslint-plugin-import-x: 4.18.1
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-react-hooks: 7.1.1
  prettier: 3.10.1
  jscpd: 5.4.3
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
  zod: ~4.6.7
  fastify: 5.12.8
  '@fastify/type-provider-typebox': 6.3.0
  typebox: 1.4.7
  '@fastify/swagger': 9.9.3
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  pg: 8.23.1
  '@types/pg': 8.23.1
  '@anthropic-ai/sdk': 1.8.0
  uuid: 14.0.3
  react: 19.3.1
  react-dom: 19.3.1
  vite: 8.3.8
  '@vitejs/plugin-react': 6.3.0
  tsx: 4.23.15
  jsdom: 31.0.0
  '@testing-library/react': 16.3.3
  fake-indexeddb: 6.2.8
  '@playwright/test': 1.65.0
  axe-core: 4.14.0
  '@axe-core/playwright': 4.14.0
  acorn: 8.19.0
  '@types/node': 22.20.5
